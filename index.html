<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Dashboard UI</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        :root {
            --bg-color: #111;
            --panel-bg: rgba(20, 20, 20, 0.85);
            --accent: #3498db;
            --text: #fff;
            --dock-bg: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }

        /* რუკის კონტეინერი */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* მანქანის მარკერი */
        .car-marker {
            transition: all 0.5s linear;
        }

        /* ზედა ინფო პანელი */
        #top-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 30px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .speedometer {
            text-align: center;
        }
        .speed-val {
            font-size: 32px;
            font-weight: bold;
        }
        .speed-unit {
            font-size: 14px;
            color: #aaa;
        }
        
        .battery-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        /* ქვედა Dock / მენიუ */
        #bottom-dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: var(--dock-bg);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dock-icon {
            font-size: 28px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }

        .dock-icon:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }

        /* აპლიკაციების ფანჯრები */
        .app-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 100;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            width: 400px;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            opacity: 0;
            transition: 0.2s;
        }

        .app-window.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .close-btn {
            background: #ff4757;
            border: none;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .setting-group {
            margin-bottom: 15px;
        }
        
        .setting-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
        }

        select, input, button.action-btn {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
            outline: none;
        }

        button.action-btn {
            background: var(--accent);
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            border: none;
        }
        
        button.action-btn:hover {
            opacity: 0.9;
        }

        /* მარშრუტის პანელი */
        #route-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 300px;
        }
        
        #route-info {
            display: none;
            margin-top: 15px;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
        }
        
        /* შეტყობინებები */
        #toast-container {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            animation: fadeInOut 3s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- რუკა -->
    <div id="map"></div>

    <!-- სიჩქარის პანელი -->
    <div id="top-panel">
        <div class="speedometer">
            <div class="speed-val" id="speed-display">0</div>
            <div class="speed-unit">KM/H</div>
        </div>
        <div class="battery-info">
            🔋 <span id="battery-soc">85%</span>
        </div>
    </div>

    <!-- ნავიგაცია -->
    <div id="route-panel">
        <div class="setting-group" style="margin: 0;">
            <input type="text" id="destination-input" placeholder="შეიყვანეთ მისამართი..." onkeypress="if(event.key==='Enter') startNavigation()">
            <button class="action-btn" onclick="startNavigation()">მარშრუტის დაწყება</button>
        </div>
        <div id="route-info">
            <p>🛣️ მანძილი: <span id="route-dist">--</span> კმ</p>
            <p>⏱️ დრო: <span id="route-time">--</span> წთ</p>
            <button class="action-btn" style="background: #e74c3c;" onclick="cancelNavigation()">გაუქმება</button>
        </div>
    </div>

    <!-- ქვედა მენიუ -->
    <div id="bottom-dock">
        <div class="dock-icon" onclick="locateMe()" title="ჩემი ლოკაცია">📍</div>
        <div class="dock-icon" onclick="toggleWindow('settings-window')" title="პარამეტრები">⚙️</div>
        <div class="dock-icon" onclick="toggleWindow('ai-window')" title="AI ასისტენტი">🤖</div>
    </div>

    <!-- პარამეტრები -->
    <div id="settings-window" class="app-window">
        <div class="app-header">
            <h3>⚙️ სისტემის პარამეტრები</h3>
            <button class="close-btn" onclick="toggleWindow('settings-window')">✖</button>
        </div>
        
        <div class="setting-group">
            <label>რუკის სტილი (Mapbox)</label>
            <select id="map-style-select" onchange="changeMapStyle()">
                <option value="dark">მუქი (Dark)</option>
                <option value="street">ქუჩები (Streets)</option>
                <option value="satellite">სატელიტი (Satellite)</option>
            </select>
        </div>

        <div class="setting-group">
            <label>მანქანის იკონი</label>
            <select id="car-icon-select" onchange="updateCarIcon()">
                <option value="🚘">წითელი მანქანა (🚘)</option>
                <option value="🚙">ლურჯი მანქანა (🚙)</option>
                <option value="➤">ისარი (➤)</option>
                <option value="🔵">წერტილი (🔵)</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label>სიმულაციის კონტროლი</label>
            <button class="action-btn" onclick="simulateDriving()">🚗 სიარულის სიმულაცია</button>
        </div>
    </div>

    <!-- AI ფანჯარა -->
    <div id="ai-window" class="app-window">
        <div class="app-header">
            <h3>🤖 AI Copilot</h3>
            <button class="close-btn" onclick="toggleWindow('ai-window')">✖</button>
        </div>
        <div id="ai-chat" style="height: 200px; overflow-y: auto; margin-bottom: 10px; font-size: 14px; color: #ddd; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;">
            <div>✨ გამარჯობა! მე ვარ თქვენი მანქანის ასისტენტი.</div>
        </div>
        <input type="text" id="ai-input" placeholder="გკითხეთ რამე..." onkeypress="if(event.key==='Enter') sendAIMessage()">
    </div>

    <div id="toast-container"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <script>
        // თქვენი Mapbox API გასაღები
        const MAPBOX_TOKEN = 'pk.eyJ1Ijoic2Fya21tZyIsImEiOiJjbXBsMWFwdjIyMHJ0MnBxdnNteDk1ejdyIn0.D-DH-vZZEwNiIaFMO2SeGQ';

        let map, baseLayer, carMarker, routingControl;
        let currentPosition = [41.7151, 44.8271]; 
        let currentSpeed = 0;
        let currentHeading = 0;
        
        // Mapbox სტილები
        const mapStyles = {
            dark: `https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/256/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
            street: `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/256/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
            satellite: `https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/256/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`
        };

        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView(currentPosition, 16);

            baseLayer = L.tileLayer(mapStyles.dark, { maxZoom: 20 }).addTo(map);
            updateCarIcon(); 
        }

        function changeMapStyle() {
            const styleKey = document.getElementById('map-style-select').value;
            if (baseLayer) { map.removeLayer(baseLayer); }
            baseLayer = L.tileLayer(mapStyles[styleKey], { maxZoom: 20 }).addTo(map);
            showToast("რუკის სტილი განახლდა");
        }

        function updateCarIcon() {
            const iconChar = document.getElementById('car-icon-select').value;
            const iconHtml = `<div style="font-size: 40px; transform: rotate(${currentHeading}deg); text-shadow: 0 4px 10px rgba(0,0,0,0.5);">${iconChar}</div>`;
            
            const carIcon = L.divIcon({ 
                className: 'car-marker', 
                html: iconHtml, 
                iconSize: [50, 50], 
                iconAnchor: [25, 25] 
            });

            if (carMarker) {
                carMarker.setIcon(carIcon);
            } else {
                carMarker = L.marker(currentPosition, { icon: carIcon, zIndexOffset: 1000 }).addTo(map);
            }
        }

        // გლუვი ზუმი და პოზიციის განახლება
        function updateLocation(lat, lng, speed, heading) {
            currentPosition = [lat, lng];
            currentSpeed = speed;
            currentHeading = heading || 0;

            document.getElementById('speed-display').innerText = Math.round(speed);
            
            updateCarIcon();
            carMarker.setLatLng(currentPosition);

            let targetZoom = 18; 
            if (speed > 80) targetZoom = 14;
            else if (speed > 50) targetZoom = 15.5;
            else if (speed > 20) targetZoom = 17;

            // გლუვი ანიმაცია უხეში გადასვლების თავიდან ასაცილებლად
            map.setView(currentPosition, targetZoom, {
                animate: true,
                pan: { duration: 1, easeLinearity: 0.2 },
                zoom: { animate: true, duration: 1 }
            });
        }

        function locateMe() {
            if (navigator.geolocation) {
                showToast("📍 ლოკაციის ძიება...");
                navigator.geolocation.getCurrentPosition(pos => {
                    updateLocation(pos.coords.latitude, pos.coords.longitude, 0, pos.coords.heading);
                    showToast("✅ ლოკაცია ნაპოვნია");
                }, () => {
                    showToast("❌ ლოკაციაზე წვდომა შეზღუდულია");
                });
            }
        }

        function startNavigation() {
            const query = document.getElementById('destination-input').value;
            if(!query) return;

            const destLat = currentPosition[0] + (Math.random() - 0.5) * 0.05;
            const destLng = currentPosition[1] + (Math.random() - 0.5) * 0.05;
            
            if (routingControl) { map.removeControl(routingControl); }
            
            showToast("🛣️ მარშრუტის გამოთვლა...");
            
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(currentPosition[0], currentPosition[1]),
                    L.latLng(destLat, destLng)
                ],
                show: false,
                lineOptions: { styles: [{ color: '#3498db', opacity: 0.8, weight: 6 }] }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                const routes = e.routes[0];
                document.getElementById('route-panel').style.display = 'block';
                document.getElementById('route-info').style.display = 'block';
                document.getElementById('route-dist').innerText = (routes.summary.totalDistance / 1000).toFixed(1);
                document.getElementById('route-time').innerText = Math.round(routes.summary.totalTime / 60);
            });
        }

        function cancelNavigation() {
            if (routingControl) { map.removeControl(routingControl); }
            document.getElementById('route-info').style.display = 'none';
            document.getElementById('destination-input').value = "";
            showToast("მარშრუტი გაუქმდა");
        }

        function toggleWindow(id) {
            const win = document.getElementById(id);
            if (win.classList.contains('active')) {
                win.classList.remove('active');
            } else {
                document.querySelectorAll('.app-window').forEach(w => w.classList.remove('active'));
                win.classList.add('active');
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        function sendAIMessage() {
            const inp = document.getElementById('ai-input');
            const chat = document.getElementById('ai-chat');
            if(inp.value.trim() === "") return;
            
            chat.innerHTML += `<div style="margin-top:10px; color:#fff;"><b>თქვენ:</b> ${inp.value}</div>`;
            inp.value = "";
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                chat.innerHTML += `<div style="margin-top:10px; color:#3498db;"><b>AI:</b> სისტემა მუშაობს იდეალურად. მოთხოვნა მიღებულია.</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 1000);
        }

        let simInterval;
        function simulateDriving() {
            if(simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                showToast("🛑 სიმულაცია შეჩერდა");
                updateLocation(currentPosition[0], currentPosition[1], 0, currentHeading);
                return;
            }
            showToast("🚗 სიმულაცია დაიწყო");
            toggleWindow('settings-window');
            
            let speed = 0;
            let heading = 0;
            
            simInterval = setInterval(() => {
                if(speed < 95) speed += Math.random() * 5; 
                
                const newLat = currentPosition[0] + 0.0001;
                const newLng = currentPosition[1] + 0.0001;
                heading = 45; 

                updateLocation(newLat, newLng, speed, heading);
            }, 1000); 
        }

        window.onload = initMap;

    </script>
</body>
</html>
