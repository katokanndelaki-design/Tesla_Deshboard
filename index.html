<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Telemetry Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000;
            color: #fff;
        }
        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            z-index: 1;
        }
        .dock {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 20, 0.75);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dock-icon {
            cursor: pointer;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: 0.2s;
            font-size: 18px;
        }
        .dock-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .dock-icon.active {
            background: rgba(255, 255, 255, 0.35);
        }
        .app-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 420px;
            height: 320px;
            background: rgba(25, 25, 25, 0.85);
            border-radius: 16px;
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(15, 15, 15, 0.9);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <!-- რუკის კონტეინერი -->
    <div id="map"></div>
    
    <!-- შეტყობინებების (Toast) ზონა -->
    <div id="toast" class="toast">📍 დანიშნულების ადგილი მონიშნულია</div>

    <!-- Dock (მენიუ ქვედა პანელზე) -->
    <div class="dock">
        <div class="dock-icon" id="dock-music" onclick="toggleApp('app-music')" title="მუსიკა">🎵</div>
    </div>

    <!-- მუსიკის აპლიკაციის ფანჯარა -->
    <div id="app-music" class="app-window">
        <h3>მუსიკა</h3>
        <p>აუდიო ფლეიერის ინტერფეისი...</p>
        <button onclick="collapseToMini('app-music')" style="margin-top:auto; padding: 8px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer;">დახურვა</button>
    </div>

    <!-- Leaflet JS ბიბლიოთეკა -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase App & Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // --- 1. Firebase კონფიგურაცია და მონაცემთა ბაზა ---
        const fbConfig = { 
            apiKey: "AIzaSyAH3yVbBGrhvzbSx7J1GxNcVsl_ykX_OX0", 
            authDomain: "tesla-telemetry-29fb6.firebaseapp.com", 
            databaseURL: "https://tesla-telemetry-29fb6-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "tesla-telemetry-29fb6" 
        };
        
        try { 
            if (!firebase.apps.length) { 
                firebase.initializeApp(fbConfig); 
            } 
        } catch(e) { 
            console.log("Firebase Init Error", e); 
        }

        const VIN = "5YJYGDEF1LF009721";
        const db = firebase.database().ref(VIN);
        const dbSettings = firebase.database().ref(VIN + "/settings");

        // --- 2. Gemini API გასაღები ---
        let apiKey = "AIzaSyCiIRonRvsdHUHFIIo43JJ7Gp7Moq1N4ik";

        // --- 3. რუკის ინიციალიზაცია ---
        const map = L.map('map', { zoomControl: false }).setView([41.7151, 44.8271], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let destinationMarker = null;
        let currentDestinationLatLng = null;

        // --- 4. Toast შეტყობინების ჩვენება ---
        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.style.display = 'block';
            setTimeout(() => { 
                t.style.display = 'none'; 
            }, 3000);
        }

        // --- 5. აპლიკაციის ფანჯრების მართვა ---
        function toggleApp(appId) {
            const win = document.getElementById(appId);
            const dockIcon = document.getElementById('dock-' + appId.split('-')[1]);
            
            if (win.style.display === 'flex') {
                win.style.display = 'none';
                if(dockIcon) dockIcon.classList.remove('active');
            } else {
                win.style.display = 'flex';
                if(dockIcon) dockIcon.classList.add('active');
            }
        }

        function collapseToMini(appId) {
            const win = document.getElementById(appId);
            win.style.display = 'none';
            const dockIcon = document.getElementById('dock-' + appId.split('-')[1]);
            if(dockIcon) dockIcon.classList.remove('active');
        }

        // --- 6. რუკაზე კლიკის და პინის დასმის ლოგიკა ---
        map.on('click', function(e) {
            let windowClosed = false;

            // ჯერ ვამოწმებთ, არის თუ არა ღია რომელიმე ფანჯრა. თუ არის - ვხურავთ
            document.querySelectorAll('.app-window').forEach(win => {
                if (win.style.display === 'flex') {
                    windowClosed = true;
                    win.style.display = 'none';
                    let dockIcon = document.getElementById('dock-' + win.id.split('-')[1]);
                    if(dockIcon) dockIcon.classList.remove('active');
                }
            });

            // თუ ფანჯარა არ დახურულა ამ კლიკით, ვსვამთ ახალ პინს რუკაზე
            if (!windowClosed) {
                if (destinationMarker) {
                    map.removeLayer(destinationMarker);
                }
                
                destinationMarker = L.marker(e.latlng).addTo(map);
                currentDestinationLatLng = e.latlng;
                
                showToast("📍 დანიშნულების ადგილი მონიშნულია");
            }
        });
    </script>
</body>
</html>
